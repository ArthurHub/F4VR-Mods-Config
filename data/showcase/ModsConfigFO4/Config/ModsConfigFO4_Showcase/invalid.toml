# Values of the Mods Config FO4 VR showcase config spec that are not the ones of their settings, which the menu shows
# as invalid. Editing or resetting a setting replaces its value on Save.

[Invalid]
fPastMost = 2.0
bText = "yes"
sPlace = "elbow"
sTooLong = "Much longer than eight"

# a setting whose warning holds: the invalid value is told, and not the warning
[Warnings]
bInvalid = "yes"

# in a section that is folded as the page is shown, which says it hides an invalid value
[Folded]
fPastMost = 2.0

# a binding whose table the framework cannot read, and one of a way its setting does not take
[Bindings]
kTypo = { hand = "offhand", type = "tap", button = "thumbstik" }
kUntaken = { hand = "primary", type = "tap", button = "grip" }

# a haptic of a name the framework does not have
[Haptics]
sTypo = "Tik"

# a color the framework cannot read
[Colors]
cOutOfRange = { rgb = [300, 0, 0] }
