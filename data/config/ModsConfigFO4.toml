[ModsConfigFO4]

#
# ---------------
# Live Reload:
# Any change to the file while the game is running will be detected and applied immediately.
# Useful to modify advanced settings and seeing the effects without restarting the game.


# Help in the menu's title bar stands out as "? Help", until you first open the Help page, which turns this
# off. Turn it on to have it stand out again.
bHighlightHelp = true


[Developer]

# For a config spec's author: the menu's front page shows each config spec's problems, what the menu left
# out of it and what it read that is likely not meant, with a report for each config spec. The log has them
# either way.
bDeveloperTools = false

# Which config specs the front page lists: "attention" for those with an error or a warning, or that are not
# loaded, "all" for every config spec, and "one" for sConfigSpec alone. The front page writes it too.
sShowConfigSpecs = "attention"

# The config spec that "one" lists, by its modName.
sConfigSpec = ""

# Whether the front page's Developer section is folded, as you left it.
bFolded = false


[Debug]

# The level of log message to output; 2 - info (basic), 1 - debug (more logs), 0 - trace (A LOT of logs)
iLogLevel = 2

# Sets the spdlog output pattern for each normal log message.
# Examples: "%H:%M:%S.%e %l: %v"; "%H:%M:%S %L [%s:%#]: %v"
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
sLogPattern = "%H:%M:%S.%e %l [%-20!k] %v"

# Mod-defined numeric scratch values for runtime experiments.
fFlowFlag1 = 0.0
fFlowFlag2 = 0.0
fFlowFlag3 = 0.0

# Mod-defined text scratch values.
sFlowText1 = ""
sFlowText2 = ""

# Writes named game-state dumps to the mod log and removes each name after it runs.
# Examples: ["skelly", "fp_skelly"]; ["geometry", "all_nodes"]
# Timing: "perf_reset" starts a perf window, then "perf" logs what each part of the frame cost since
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
aDumpDataOnce = []

# Internal use for versioning
iVersion = 1
