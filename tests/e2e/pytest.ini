[pytest]
testpaths = .
addopts = -p no:cacheprovider
markers =
    sweep: each setting of each mod, changed, saved and set back
    showcase: the showcase walkthrough, section by section
    dialog: the dialog that asks about unsaved changes
    mcm: an MCM mod's change, Keep and Revert
    live: the live preview of FRIK and Immersive Flashlight
    navigation: Back, the breadcrumbs, Help, and Minimize and Restore
    rows: Reset, buttons, client states, MCM texts from the game, images and plugin requirements, translations, reports
    session: a loading screen ends the editing session
