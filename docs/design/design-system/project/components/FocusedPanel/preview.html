<!-- @dsCard group="Panels" height=480 width=624 subtitle="576 x 432 layout px on the offhand; a choice becomes a stepper" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Focused panel — preview</title></head>
<body>
<div class="mc-world" style="display:flex;gap:24px;align-items:flex-start">
<div class="mc-focused">
<div class="fhead"><span class="grow t-body">Immersive Flashlight VR</span><span class="mc-btn t-body" style="min-width:88px">Full</span><span class="mc-btn is-icon"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M6 17 H18"/></svg></span></div>
<div class="mc-desc t-body"><span class="name">Brightness:</span> How bright the beam is. 1.00 is the game's own flashlight. Default 1.00.</div>
<div class="item"><div class="t-body" style="display:flex;align-items:center;gap:8px"><span>Brightness</span><span class="mc-dot"></span></div>
<div class="ctl t-body"><span class="mc-track is-pending"><i class="fill" style="width:170px"></i><i class="grab" style="left:180px"></i></span><span class="mc-value is-pending">1.25</span><span class="mc-btn is-icon"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M4 5 V10 H9"/><path d="M5.2 15 A7.5 7.5 0 1 0 6.6 7 L4 10"/></svg></span></div></div>
<div class="item"><div class="t-body">Beam mode</div>
<div class="ctl t-body"><span class="mc-stepper" style="flex:1"><span class="mc-btn is-icon"><svg class="tri" viewBox="0 0 14 14"><path d="M10 2 L3 7 L10 12 Z"/></svg></span><span class="label" style="flex:1;width:auto">Spot</span><span class="mc-btn is-icon"><svg class="tri" viewBox="0 0 14 14"><path d="M4 2 L11 7 L4 12 Z"/></svg></span></span><span class="mc-btn is-icon is-slot"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M4 5 V10 H9"/><path d="M5.2 15 A7.5 7.5 0 1 0 6.6 7 L4 10"/></svg></span></div></div>
<div class="mc-footer t-body"><div class="status"><span class="mc-dot"></span><span class="mc-amber">1 unsaved</span></div><span class="mc-btn t-body  ">Discard</span><span class="mc-btn t-body is-primary ">Save</span></div>
</div>
</div>
</body>
</html>
