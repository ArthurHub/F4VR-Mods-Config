<!-- @dsCard group="Actions" height=540 width=1180 subtitle="Clean, pending, blocked, and the status line of an MCM mod" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Save bar — preview</title></head>
<body>
<div class="mc-world"><div class="mc-sheet mc-stack" style="width:1120px;gap:12px">
<span class="t-detail mc-muted">Clean</span>
<div class="mc-footer t-body"><div class="status"><span class="mc-muted">No unsaved changes</span></div><span class="mc-btn t-body  is-disabled">Discard</span><span class="mc-btn t-body is-primary is-disabled">Save</span></div>
<span class="t-detail mc-muted">Pending</span>
<div class="mc-footer t-body"><div class="status"><span class="mc-dot"></span><span class="mc-amber">1 unsaved change</span></div><span class="mc-btn t-body  ">Discard</span><span class="mc-btn t-body is-primary ">Save</span></div>
<span class="t-detail mc-muted">Blocked by an invalid value</span>
<div class="mc-footer t-body"><div class="status"><svg class="mc-warn" viewBox="0 0 20 18"><path class="tri" d="M10 1 L19 17 H1 Z"/><rect class="bang" x="9" y="6" width="2" height="6"/><rect class="bang" x="9" y="13.4" width="2" height="2"/></svg><span class="mc-red">Brightness is invalid. Save shows what to fix.</span></div><span class="mc-btn t-body  ">Discard</span><span class="mc-btn t-body  ">Save</span></div>
<span class="t-detail mc-muted">An MCM mod: no Save bar</span>
<div class="mc-footer t-body"><div class="status"><span class="mc-muted">Changes are saved as they are made</span></div></div>
</div></div>
</body>
</html>
