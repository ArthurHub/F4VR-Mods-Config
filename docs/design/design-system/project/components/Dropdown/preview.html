<!-- @dsCard group="Settings" height=460 width=1170 subtitle="Closed and open; help for the pointed option shows in the footer" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dropdown — preview</title></head>
<body>
<div class="mc-world mc-stack" style="gap:0"><div class="mc-sheet" style="width:772px;position:relative;border-radius:8px 8px 0 0">
<div class="mc-row is-active"><span class="name t-body"><span class="txt">Beam mode</span></span><div class="ctl t-body"><div class="main"><span class="mc-combo is-open"><span>Spot</span><svg viewBox="0 0 14 14"><path d="M2 4 L12 4 L7 11 Z"/></svg></span></div><span class="mc-btn is-icon is-slot" title="Reset"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M4 5 V10 H9"/><path d="M5.2 15 A7.5 7.5 0 1 0 6.6 7 L4 10"/></svg></span></div></div>
<div class="mc-row "><span class="name t-body"><span class="txt">Beam angle</span></span><div class="ctl t-body"><div class="main"><span class="mc-slide"><span class="mc-step "><svg viewBox="0 0 14 14"><path d="M10 2 L3 7 L10 12 Z"/></svg></span><span class="mc-track is-stepped "><i class="fill" style="width:61px"></i><i class="grab" style="left:71px"></i></span><span class="mc-step "><svg viewBox="0 0 14 14"><path d="M4 2 L11 7 L4 12 Z"/></svg></span></span><span class="mc-value ">40°</span></div><span class="mc-btn is-icon is-slot" title="Reset"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M4 5 V10 H9"/><path d="M5.2 15 A7.5 7.5 0 1 0 6.6 7 L4 10"/></svg></span></div></div>
<div class="mc-row "><span class="name t-body"><span class="txt">Hours per battery</span></span><div class="ctl t-body"><div class="main"><span class="mc-stepper"><span class="mc-btn is-icon"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M6 12 H18"/></svg></span><span class="mc-value" style="justify-content:center">8</span><span class="mc-btn is-icon"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M6 12 H18 M12 6 V18"/></svg></span></span></div><span class="mc-btn is-icon is-slot" title="Reset"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M4 5 V10 H9"/><path d="M5.2 15 A7.5 7.5 0 1 0 6.6 7 L4 10"/></svg></span></div></div>
<div class="mc-row "><span class="name t-body"><span class="txt">Drain battery</span></span><div class="ctl t-body"><div class="main"><span class="mc-toggle"><span class="is-off">Off</span><span>On</span></span></div><span class="mc-btn is-icon is-slot" title="Reset"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M4 5 V10 H9"/><path d="M5.2 15 A7.5 7.5 0 1 0 6.6 7 L4 10"/></svg></span></div></div>
<div class="mc-row "><span class="name t-body"><span class="txt">Beam shadows</span></span><div class="ctl t-body"><div class="main"><span class="mc-toggle"><span>Off</span><span class="is-on">On</span></span></div><span class="mc-btn is-icon is-slot" title="Reset"><svg class="mc-ico" viewBox="0 0 24 24"><path d="M4 5 V10 H9"/><path d="M5.2 15 A7.5 7.5 0 1 0 6.6 7 L4 10"/></svg></span></div></div>
<div class="mc-popup t-body" style="position:absolute;right:72px;top:68px;width:392px;z-index:2"><div class="mc-option is-current"><svg class="mc-ico check" viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 6.5"/></svg><span>Spot</span></div><div class="mc-option is-hover"><span class="check"></span><span>Flood</span><span class="mc-mark" style="position:relative;margin-left:120px"></span></div><div class="mc-option"><span class="check"></span><span>Lantern</span></div></div>
</div>
<div class="mc-sheet" style="width:1120px;padding:0;border-radius:0 8px 8px 8px"><div class="mc-footer"><div class="help t-body"><span class="name">Flood:</span> A wide, even beam with a short reach, for lighting a room.</div><span class="mc-btn t-body is-disabled">Discard</span><span class="mc-btn t-body is-primary is-disabled">Save</span></div></div>
</div>
</body>
</html>
