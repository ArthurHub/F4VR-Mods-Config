exclude: ^(data|external)/

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        args: [--style=file]
        files: ^(src|tests)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|inl)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]

  # The design system's generated files: a commit that leaves one out of date fails, with the file rewritten.
  - repo: local
    hooks:
      - id: design-system-previews
        name: design system previews
        entry: python docs/design/design-system/tools/gen_previews.py
        language: python
        pass_filenames: false
        files: ^docs/design/design-system/
      - id: design-system-theme
        name: design system theme (src/Theme.h)
        entry: python docs/design/design-system/tools/gen_theme.py
        language: python
        pass_filenames: false
        files: ^(docs/design/design-system/|src/Theme\.h$)
